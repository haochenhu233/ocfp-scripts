---
# binding-secret-credentials.yml
#
# Force the autoscaler broker to mint basic-auth (binding-secret) custom-metrics
# credentials instead of the release-15.13.x default of x509 (mTLS-only).
#
# Why: both of our edges terminate TLS and discard client certificates
# (client sbx: AWS ELB HTTPS listener; aws lab: Cloudflare proxy), so x509
# bindings can never deliver an instance-identity cert to metricsforwarder —
# every submission fails 401 "authentication method not found". With
# binding-secret, bindings carry url/username/password again and emitters
# authenticate with basic auth, which works through any edge.
#
# Usage (in the autoscaler deployment repo, per environment):
#   1. copy this file to:  <deployment-repo>/ops/binding-secret-credentials.yml
#   2. add "binding-secret-credentials" to the env yaml's genesis.features list
#      (genesis accepts any feature with a matching ops/<feature>.yml)
#   3. genesis deploy <env>
#   4. re-bind + restart any app whose binding was created while the x509
#      default was active — bindings keep the credentials minted at bind time,
#      so existing mTLS-only bindings do NOT heal on their own:
#        cf unbind-service <app> <instance>
#        cf bind-service   <app> <instance> -c <policy.json>
#        cf restart <app>
#
# Verify after deploy:
#   bosh -d <autoscaler-dep> ssh apiserver -c \
#     'sudo grep -B1 -A1 default_credential_type /var/vcap/jobs/golangapiserver/config/apiserver.yml'
#   # expect: binding-secret
#   cf env <app> | grep -oE '"(mtls_url|url|username)": ?"[^"]*"'
#   # a fresh binding now shows url + username (+ mtls_url, which is harmless)

- type: replace
  path: /instance_groups/name=apiserver/jobs/name=golangapiserver/properties/autoscaler/apiserver/broker/default_credential_type?
  value: binding-secret
